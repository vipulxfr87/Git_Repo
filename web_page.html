<!DOCTYPE html>
<html lang="en">
<style>
  body { 
    margin: 0; height: 100vh; display: grid; place-items: center; 
    background: #e0f7fa; font-family: sans-serif; text-align: center;
  }
  .dude { 
    font-size: 80px; animation: jump 1s infinite alternate; 
  }
  h1 { color: #00796b; }
  span { color: #ff5722; font-size: 1.2em; }
  
  @keyframes jump {
    from { transform: translateY(0); }
    to { transform: translateY(-20px); }
  }
</style>
<body>
  <div>
    <div class="dude">🤖</div>
    <h1>Welcome to the <br><span>Vipul World</span></h1>
  </div>
</body>
</html>
